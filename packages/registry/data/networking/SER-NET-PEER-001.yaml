  - gap_id: "BGR-NET-PEER-002"
    gap_type: "policy"
    description: "Cross-account VPC peering requires different IAM and acceptance workflows per provider"
    severity: "major"
    affected_targets: ["azure", "gcp"]
    workaround: "Configure provider-specific cross-tenant authorization and peering acceptance"
    requires_manual_review: true
  - gap_id: "BGR-NET-PEER-003"
    gap_type: "topology"
    description: "Azure requires bidirectional peering resources; AWS and GCP use single acceptance model"
    severity: "minor"
    affected_targets: ["azure"]
    workaround: "Create two Azure peering resources, one in each direction, to match AWS single peering"
